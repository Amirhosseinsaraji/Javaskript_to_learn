
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple calculator application.">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@700&display=swap" rel="stylesheet">
  <title>Calculator App</title>
</head>
<body>
  <main>
    <header>
      <h1>Calculator</h1>
      <div class="theme-selector">
        <fieldset>
          <legend>Theme</legend>
          <label for="theme-1">1</label>
          <input type="radio" id="theme-1" name="theme" value="1" checked>
          <label for="theme-2">2</label>
          <input type="radio" id="theme-2" name="theme" value="2">
          <label for="theme-3">3</label>
          <input type="radio" id="theme-3" name="theme" value="3">
        </fieldset>
      </div>
    </header>
    <section aria-label="Calculator display">
      <output aria-live="polite" aria-atomic="true">0</output>
    </section>

    <section aria-label="Calculator keypad">
      <!-- Calculator buttons will be added in a later issue. -->
    </section>
  </main>

  <footer class="attribution">
    Challenge by
    <a href="https://www.frontendmentor.io?ref=challenge">
      Frontend Mentor
    </a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
